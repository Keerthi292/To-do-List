version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: svelte-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME:-todo_db}
      - COLLECTION_NAME=${COLLECTION_NAME:-todos}
